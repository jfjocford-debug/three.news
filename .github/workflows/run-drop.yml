name: Run Three Drop

# Runs the Three pipeline on GitHub's own runners — no separate hosting
# needed, and no timeout constraints like a serverless function would have.
#
# SCHEDULING: this workflow no longer schedules itself. GitHub Actions'
# native `schedule:` trigger was tested and found unreliable on this repo —
# real firings landed hours away from their specified time (confirmed via
# run logs, and independently corroborated by other users reporting the
# same 1-2 hour delays in GitHub's own community discussions). Rather than
# keep tuning around an unreliable trigger, timing is now owned by an
# external scheduler (cron-job.org) that calls this workflow's
# `workflow_dispatch` endpoint directly via GitHub's REST API, passing
# which drop to run as an input. See project docs for the exact 3 jobs
# configured there (morning/afternoon/latenight, in America/Chicago time).

on:
  workflow_dispatch:
    inputs:
      drop:
        description: "Which drop to run"
        required: true
        type: choice
        options:
          - morning
          - afternoon
          - latenight

permissions:
  contents: read

concurrency:
  group: three-drop-run
  cancel-in-progress: false

jobs:
  run-drop:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 26.6.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run the drop
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          FRAMER_PROJECT_URL: ${{ secrets.FRAMER_PROJECT_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
        run: npx tsx src/run-drop.ts ${{ github.event.inputs.drop }}
